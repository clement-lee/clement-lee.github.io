name: Render slides (best-effort check)

# Verification only: renders every deck under slides/src/ into a scratch
# directory and reports pass/fail per deck. Never fails the job on an
# individual render error (older decks are expected to fail — see
# slides/README.md) and never touches the committed slides/*.html|*.pdf
# files. Publishing a re-render is always a deliberate local
# `make render-one` + commit, not something CI does automatically.

on:
  push:
    paths:
      - "slides/src/**"
      - ".github/workflows/render-slides.yml"
  pull_request:
    paths:
      - "slides/src/**"

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Restore R packages from lockfile
        working-directory: slides/src
        run: Rscript -e 'renv::restore(prompt = FALSE)'

      - name: Render every deck into a scratch copy (best-effort)
        run: |
          cp -r slides /tmp/slides-check
          cd /tmp/slides-check
          ./src/scripts/render_all.sh
        continue-on-error: true

      - name: Post render report to job summary
        run: cat /tmp/slides-check/src/render-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload render report
        uses: actions/upload-artifact@v4
        with:
          name: render-report
          path: /tmp/slides-check/src/render-report.md
