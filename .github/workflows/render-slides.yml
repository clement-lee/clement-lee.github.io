name: Render slides (best-effort check)

# Verification only: renders every deck under slides/src/ into a scratch
# directory and reports pass/fail per deck. Never fails the job on an
# individual render error (older decks are expected to fail — see
# slides/README.md) and never touches the committed slides/*.html|*.pdf
# files. Publishing a re-render is always a deliberate local
# `make render-one` + commit, not something CI does automatically.

on:
  push:
    paths:
      - "slides/src/**"
      - ".github/workflows/render-slides.yml"
  pull_request:
    paths:
      - "slides/src/**"

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          working-directory: slides/src

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      # Several lockfile packages (igraph, gsl, magick, ragg/textshaping/
      # systemfonts, clipr, ...) wrap C libraries that renv::restore's binary
      # install doesn't bring with it — it fails at *load* time, not install
      # time. This list was computed from Posit's sysreqs API against
      # src/renv.lock (ubuntu/24.04) rather than discovered one CI run at a
      # time; regenerate it the same way if new packages are added to the
      # lockfile and CI starts failing to load one of them again:
      #   https://packagemanager.posit.co/__api__/repos/cran/sysreqs?all=false&pkgname=<pkg>&...&distribution=ubuntu&release=24.04
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglpk-dev libgsl-dev libmagick++-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev zlib1g-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev \
            libicu-dev libuv1-dev libx11-dev gsfonts

      - name: Restore R packages from lockfile
        working-directory: slides/src
        run: Rscript -e 'renv::restore(prompt = FALSE)'

      - name: Render every deck into a scratch copy (best-effort)
        run: |
          cp -r slides /tmp/slides-check
          cd /tmp/slides-check
          ./src/scripts/render_all.sh
        continue-on-error: true

      - name: Post render report to job summary
        run: cat /tmp/slides-check/src/render-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload render report
        uses: actions/upload-artifact@v4
        with:
          name: render-report
          path: /tmp/slides-check/src/render-report.md
